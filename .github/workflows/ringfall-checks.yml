# The quick guardrails, on every pull request: types, the screens' lint (docs/ringfall/ui.md) and
# the model rules (docs/ringfall/models.md). The three gates that play the game (build, sim,
# shots) take minutes to an hour and are run by hand before a change is put up (CLAUDE.md).
name: ringfall-checks
on:
  pull_request:
  push:
    # Feature branches too: stacked PRs sometimes never get a merge ref, and GitHub then
    # skips pull_request workflows entirely (no synchronize / reopen runs). Push covers tip.
    branches: [main, "cursor/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint:ringfall
      - run: npm run models:ringfall
