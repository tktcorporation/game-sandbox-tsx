<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#262d52" />
    <link rel="manifest" href="/ringfall/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RINGFALL" />
    <link rel="apple-touch-icon" href="/ringfall/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=M+PLUS+1p:wght@500;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%237ec8e3%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2710%27 fill=%27none%27 stroke=%27%23ff5a2a%27 stroke-width=%274%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%273%27 fill=%27%23262d52%27/%3E%3C/svg%3E" />
    <title>RINGFALL</title>
  </head>
  <body>
    <div id="stage"></div>
    <div id="fx-hurt" aria-hidden="true"></div>
    <div id="fx-ult" aria-hidden="true"></div>
    <div id="fx-speed" aria-hidden="true"><i></i></div>

    <div id="hud" hidden>
      <div id="compass"><div id="compass-strip"></div><b id="compass-deg">0</b><i id="compass-mark" hidden><span></span></i><i id="compass-scout" hidden></i></div>
      <div id="island-row"></div>
      <div id="map" hidden><canvas id="map-canvas"></canvas><p><span class="map-key hold freed">●</span> 自分 <span class="map-key hold held">●</span> 敵 <span class="map-key hold titan">⬢</span> タイタン　<span class="map-key front">━</span> 前線　<span class="map-key zip">━</span> ジップライン　<span class="map-key">◆</span> 脱出　<span class="map-key flare"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><rect x="6.5" y="7" width="3" height="8" rx="1" fill="#e2563a"/><path d="M8 1 C10.5 3.5 10.5 6 8 7 C5.5 6 5.5 3.5 8 1 Z" fill="#ffd36a"/></svg></span> 発煙筒　<span class="map-key depot">■</span> 中継ボックス　<span class="map-key squad you">▶</span> 自軍 <span class="map-key squad net">▶</span> 敵 <span class="map-key squad rogue">▶</span> 野良機<span class="map-close">　<kbd>N</kbd> <span id="map-view-key">全体</span>　<kbd>M</kbd> 閉じる</span></p><span class="map-buttons"><button id="map-zoom" type="button">全体</button><button id="map-close" type="button">閉じる</button><button id="map-pause" type="button">一時停止</button></span></div>
      <div id="objective"><span id="obj-head"><em id="obj-title"></em><i id="obj-n"></i></span><span id="obj-text"></span><small id="obj-until"></small><small id="obj-contract" hidden></small><small id="obj-story" hidden></small><small id="obj-event" hidden></small><small id="obj-bag"></small><small id="obj-raid"></small><small id="obj-stealth"></small><small id="obj-exits"></small></div>
      <div id="enemy-bars" aria-hidden="true"></div>
      <div id="aware-layer" aria-hidden="true"></div>
      <div id="dmg-layer" aria-hidden="true"></div>
      <div id="dmgdir" aria-hidden="true"></div>
      <div id="xhair" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div id="hitmark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <p id="prompt"></p>
      <div id="mate-tag" aria-hidden="true"><i></i><b>リオ</b><span id="mate-tag-sub"></span></div>
      <div id="vitals">
        <div id="mate"><b>リオ</b><span id="mate-state"></span><span class="mate-bars"><i><span id="mate-sh"></span></i><i class="hp"><span id="mate-hp"></span></i></span></div>
        <div id="mods" aria-label="改造パーツ"></div>
        <div id="shield-cells"></div>
        <div id="hp"><span id="hp-fill"></span></div>
        <div id="cells"><kbd>H</kbd><span>回復</span><span id="heal-list"><i class="sh" id="n-cell">0</i><i class="sh big" id="n-battery">0</i><i class="hpi" id="n-syringe">0</i><i class="hpi big" id="n-medkit">0</i></span></div>
      </div>
      <div id="abilities">
        <div class="ab" id="ab-tac"><kbd>Q</kbd><div class="ring"><span>アーク</span></div></div>
        <div class="ab ult" id="ab-ult"><kbd>Z</kbd><div class="ring"><span id="ult-pct">0%</span></div></div>
      </div>
      <div id="weapons">
        <div id="toasts"></div>
        <div class="slot" id="slot-0"><span class="name"></span><span class="ammo"><b></b><small></small></span></div>
        <div class="slot" id="slot-1"><span class="name"></span><span class="ammo"><b></b><small></small></span></div>
      </div>
      <div id="bag-peek" hidden></div>
      <div id="bag-cards" aria-live="polite"></div>
      <div id="downed"><b>ダウン</b><span id="downed-sub">自己蘇生中</span><i><span id="downed-bar"></span></i></div>
      <div id="battery"><span id="heal-label">回復中</span><i><span id="battery-bar"></span></i></div>
    </div>

    <div id="scope" aria-hidden="true"><i></i></div>
    <div id="touch">
      <div id="t-zone-move"></div>
      <div id="t-zone-look"></div>
      <div id="t-stick-base"><i id="t-stick-knob"></i></div>
      <button type="button" class="tb" id="t-fire" data-act="fire" aria-label="撃つ"><b>撃つ</b></button>
      <button type="button" class="tb small" id="t-fire2" data-act="fire" aria-label="撃つ"><b>撃つ</b></button>
      <button type="button" class="tb" id="t-jump" data-act="Space" aria-label="ジャンプ"><b>ジャンプ</b></button>
      <button type="button" class="tb" id="t-crouch" data-act="crouch" aria-label="スライディング"><b>しゃがむ</b></button>
      <button type="button" class="tb small" id="t-ads" data-act="ads" aria-label="覗く"><b>覗く</b></button>
      <button type="button" class="tb small" id="t-reload" data-act="KeyR" aria-label="リロード"><b>リロード</b></button>
      <button type="button" class="tb ab-btn" id="t-tac" data-act="KeyQ" aria-label="アーク"><b>アーク</b></button>
      <button type="button" class="tb ab-btn ult" id="t-ult" data-act="KeyZ" aria-label="離脱ジャンプ"><b id="t-ult-pct">0%</b></button>
      <button type="button" class="tb small" id="t-battery" data-act="KeyH" aria-label="回復"><b>回復 <span id="t-cells">0</span></b></button>
      <button type="button" class="tb pill" id="t-use" data-act="KeyE" hidden><b>拾う・調べる</b></button>
      <button type="button" class="tb small" id="t-map" data-act="map" aria-label="地図"><b>地図</b></button>
      <button type="button" class="tb small" id="t-bag" data-act="bag" aria-label="バッグ"><svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true"><path d="M3 6 H13 L12 15 H4 Z" fill="currentColor"/><path d="M5.5 6 V4.5 a2.5 2.5 0 0 1 5 0 V6" stroke="currentColor" stroke-width="1.6" fill="none"/></svg></button>
    </div>
    <div id="rotate">横向きにすると遊べます</div>

    <div id="fade" aria-hidden="true"></div>
    <div id="banner" aria-live="polite"><b id="banner-head"></b><span id="banner-sub"></span></div>

    <section id="title" class="screen">
      <div class="title-inner">
        <h1>RINGFALL</h1>
        <p class="lede">前線を押し上げ、島を取り返せ。相手はロボットだけ。</p>
        <p class="title-row" id="title-row" aria-hidden="true"></p>
        <p class="touch-help"><span><b>左半分</b>移動</span><span><b>右半分</b>視点</span></p>
        <ul class="keys" id="title-keys"></ul>
        <button id="start" type="button">野営地へ</button>
        <div class="settings"><label class="sens">マウス感度 <input id="sens" type="range" min="0.4" max="2.5" step="0.05" value="1" /></label><label class="sens vol">音量 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8" /></label><label class="sens adsmode">覗き方（F） <select id="adsmode"><option value="hold">押している間</option><option value="toggle">押すたびに切り替え</option></select></label><label class="sens quality">画質 <select id="quality"><option value="auto">自動</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label></div>
        <p class="install-help" id="install-help" hidden>共有 → ホーム画面に追加</p>
        <p class="note"><a href="/">ゲーム一覧</a></p>
      </div>
    </section>

    <div id="camp" hidden>
      <div id="camp-labels" aria-hidden="true"></div>
      <div id="camp-head"><b>野営地</b><span><small>クレジット</small><b id="camp-cash"></b></span><small id="camp-hint"></small><span id="camp-row"></span></div>
      <div id="camp-plan"><h3>今日の作戦</h3><dl id="camp-plan-list"></dl></div>
      <p id="camp-prompt"></p>
    </div>

    <section id="depart" class="screen" hidden>
      <div class="depart-inner" role="dialog" aria-labelledby="depart-title">
        <div id="depart-board" class="depart-board"><canvas id="depart-map"></canvas><div id="depart-points"></div></div>
        <div class="depart-side">
          <h2 id="depart-title">出撃</h2>
          <p id="depart-start"></p>
          <p id="depart-hint" hidden></p>
          <div id="depart-carry"></div>
          <dl id="depart-list"></dl>
          <p id="depart-warn" hidden></p>
          <div class="depart-buttons"><button id="depart-go" type="button">出撃する<kbd>Enter</kbd></button><button id="depart-cancel" class="ghost" type="button">やめる<kbd>Esc</kbd></button></div>
        </div>
      </div>
    </section>

    <section id="hub" class="screen" hidden>
      <div class="hub-inner">
        <header class="hub-head">
          <h2 id="hub-title"></h2>
          <div class="hub-cash"><small>クレジット</small><b id="hub-cash"></b><small id="hub-record"></small></div>
          <button id="hub-close" class="ghost" type="button" data-act="close">閉じる<kbd>Esc</kbd></button>
        </header>
        <div class="hub-cols" id="hub-cols">
          <div class="hub-col" id="hub-stash-col">
            <h3>倉庫 <small id="hub-stash-count"></small></h3>
            <div class="hub-list" id="hub-stash"></div>
          </div>
          <div class="hub-col">
            <h3 id="hub-side-title"></h3>
            <div class="hub-list" id="hub-side"></div>
          </div>
        </div>
        <footer class="hub-foot" id="hub-foot">
          <span class="hub-foot-note" id="hub-foot-note"></span>
        </footer>
      </div>
    </section>

    <section id="pause" class="screen" hidden>
      <div class="title-inner">
        <h2>一時停止</h2>
        <button id="resume" type="button">クリックで再開</button>
        <ul class="keys" id="pause-keys"></ul>
        <div class="settings"><label class="sens">マウス感度 <input id="sens2" type="range" min="0.4" max="2.5" step="0.05" value="1" /></label><label class="sens vol">音量 <input id="vol2" type="range" min="0" max="1" step="0.05" value="0.8" /></label><label class="sens adsmode">覗き方（F） <select id="adsmode2"><option value="hold">押している間</option><option value="toggle">押すたびに切り替え</option></select></label><label class="sens quality">画質 <select id="quality2"><option value="auto">自動</option><option value="high">高</option><option value="medium">中</option><option value="low">低</option></select></label></div>
      </div>
    </section>

    <section id="results" class="screen" hidden>
      <div class="title-inner">
        <p class="label" id="result-title">生還</p>
        <div id="day-result"></div>
        <div id="haul-line"></div>
        <details id="stats-box"><summary>戦闘の記録</summary><div id="stats"></div></details>
        <div id="home"></div>
        <button id="restart" type="button">野営地に戻る</button>
      </div>
    </section>

    <script type="module" src="/src/ringfall/main.ts"></script>
  </body>
</html>
