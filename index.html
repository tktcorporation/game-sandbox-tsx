<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11142a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Saira+Condensed:wght@800&family=M+PLUS+1p:wght@500;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%2311142a%27/%3E%3Crect x=%275%27 y=%275%27 width=%2710%27 height=%2722%27 fill=%27%232034d6%27/%3E%3Crect x=%2717%27 y=%275%27 width=%2710%27 height=%2722%27 fill=%27%23ff5a2a%27/%3E%3C/svg%3E" />
    <title>ゲームを選ぶ</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11142a;
        --ink: #f2f4fb;
        --dim: #a6acc8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--bg);
        color: var(--ink);
        font-family: "M PLUS 1p", system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 24px 16px;
      }
      main {
        width: 100%;
        max-width: 960px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 20px;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.12em;
        color: var(--dim);
      }
      .games {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }
      .game {
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 220px;
        padding: 24px;
        border-radius: 6px;
        color: var(--ink);
        text-decoration: none;
        border: 2px solid transparent;
        transition: transform 120ms ease, border-color 120ms ease;
      }
      .game:hover,
      .game:focus-visible {
        transform: translateY(-2px);
        border-color: var(--accent);
        outline: none;
      }
      .game b {
        font-size: 56px;
        line-height: 0.9;
        color: var(--accent);
      }
      .game p {
        margin: 0;
        line-height: 1.6;
      }
      .game .lede {
        font-weight: 800;
      }
      .game small {
        margin-top: auto;
        color: var(--dim);
        font-size: 13px;
      }
      .hitmark {
        --accent: #ffe23d;
        background: #0b1240;
      }
      .hitmark b {
        font-family: "Big Shoulders Display", sans-serif;
        font-weight: 900;
      }
      .ringfall {
        --accent: #ff5a2a;
        background: #262d52;
      }
      .ringfall b {
        font-family: "Saira Condensed", sans-serif;
        font-weight: 800;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ゲームを選ぶ</h1>
      <nav class="games">
        <a class="game hitmark" href="/hitmark/">
          <b>HITMARK</b>
          <p class="lede">対人なし。撃って、当てて、全部倒す。</p>
          <p>部屋ごとに敵を全滅させるシューター。見下ろしの 2D と一人称の 3D を選べる。</p>
          <small>マウスとキーボード、またはスマホ</small>
        </a>
        <a class="game ringfall" href="/ringfall/">
          <b>RINGFALL</b>
          <p class="lede">降りて、漁って、生きて帰れ。相手はロボットだけ。</p>
          <p>島に降りて回収品を集め、脱出地点から生きて帰る。拠点で隠れ家を作り、脱出艇を直す。</p>
          <small>マウスとキーボード、またはスマホを横向きに</small>
        </a>
      </nav>
    </main>
  </body>
</html>
