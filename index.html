<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1240" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=M+PLUS+1p:wght@500;800&display=swap" rel="stylesheet" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%232034d6%27/%3E%3Cpath d=%27M7 7l6 6M25 7l-6 6M7 25l6-6M25 25l-6-6%27 stroke=%27%23ffe23d%27 stroke-width=%274%27/%3E%3C/svg%3E" />
    <title>HITMARK</title>
  </head>
  <body>
    <div id="stage"></div>
    <div id="vignette"></div>

    <div id="hud" hidden>
      <div id="xhair" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div>
      <div id="arrows" aria-hidden="true"></div>
      <div id="dmgdir" aria-hidden="true"></div>
      <div class="top">
        <div class="room"><b id="room">ROOM 1/6</b><span id="timer">0.0</span><span id="par"></span></div>
        <div class="remaining"><span>残り</span><b id="remaining-n">0</b></div>
        <div class="streak" id="streak"></div>
      </div>
      <p id="hint"></p>
      <div class="bottom">
        <div id="hp"></div>
        <div id="ammo"><b id="mag">30</b><i><span id="mag-bar"></span></i><small>R リロード</small></div>
      </div>
      <button id="dash-btn" type="button" aria-label="ダッシュ">DASH</button>
    </div>

    <div id="banner" aria-live="polite"><b id="banner-head"></b><span id="banner-sub"></span></div>

    <section id="title">
      <h1>HITMARK</h1>
      <p class="lede">対人なし。撃って、当てて、全部倒す。</p>
      <ul class="keys">
        <li><kbd>WASD</kbd>移動</li>
        <li><kbd>マウス</kbd>狙う / 見回す</li>
        <li><kbd>左クリック</kbd>撃つ</li>
        <li><kbd>Space</kbd>ダッシュ</li>
      </ul>
      <div class="modes">
        <button id="start3d" type="button"><b>3D</b><span>一人称で出撃</span></button>
        <button id="start" type="button"><b>2D</b><span>見下ろしで出撃</span></button>
      </div>
      <p class="touch-note">スマホ: 左半分をなぞって移動、右半分で狙って撃つ。3D はマウス推奨</p>
    </section>

    <section id="results" hidden>
      <p class="label">RUN COMPLETE</p>
      <div class="rank-row"><b id="rank">S</b><div><span>合計</span><strong id="total"></strong></div></div>
      <div id="rooms"></div>
      <div id="stats"></div>
      <button id="restart" type="button">もう一周</button>
    </section>

    <div id="rotate">横向きにすると遊べます</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
